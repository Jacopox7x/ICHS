<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>SpookyVest Sandbox</title>
    <style>
        body { font-family: 'Courier New', monospace; background: #0a0a0f; color: #cdd6f4; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 800px; background: #14141f; border: 1px solid #cba6f7; border-radius: 12px; padding: 30px; box-shadow: 0 0 20px rgba(203,166,247,0.1); }
        h1 { color: #cba6f7; text-align: center; margin-top: 0; }
        .drop-zone { border: 2px dashed #cba6f7; padding: 40px; text-align: center; border-radius: 8px; cursor: pointer; margin-bottom: 20px; transition: 0.3s; }
        .drop-zone:hover { background: rgba(203,166,247,0.05); }
        .card-profile {
            background: #14141f;
            border: 4px solid #cba6f7;
            box-shadow: 8px 8px 0 #333;
            position: relative;
            overflow: hidden;
            width: 300px;
            font-family: 'Courier New', monospace;
            color: #cdd6f4;
            text-align: left;
        }

        .prof-photo {
            height: 100px;
            background: #1a1a2e;
            border-bottom: 4px solid #cba6f7;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
        }
        .prof-photo::before {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(45deg, transparent 0px, transparent 8px, rgba(203, 166, 247, 0.05) 8px, rgba(203, 166, 247, 0.05) 10px);
        }
        .prof-avatar {
            width: 60px;
            height: 60px;
            background: #000;
            border: 4px solid #cba6f7;
            border-bottom: none;
            border-left: none;
            margin-left: 15px;
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.8rem;
            color: #cba6f7;
        }
        .prof-status-badge {
            position: absolute;
            top: 10px; right: 10px; z-index: 2;
            background: #4ade80;
            border: 3px solid #000;
            box-shadow: 3px 3px 0 #000;
            font-size: 0.6rem; font-weight: 800; letter-spacing: 0.1em;
            padding: 2px 6px; text-transform: uppercase; color: #000;
        }

        .prof-body { padding: 15px 15px 0; }
        .prof-name {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem; line-height: 1; color: #fff;
            letter-spacing: 1px; margin-bottom: 5px;
        }
        .prof-bio {
            font-size: 0.7rem; font-weight: 500; color: #a6adc8;
            border-left: 4px solid #cba6f7; padding-left: 8px;
            line-height: 1.4; margin-bottom: 10px; height: 40px; overflow: hidden;
        }

        .prof-stats {
            display: grid; grid-template-columns: 1fr 1fr 1fr;
            border-top: 3px solid #cba6f7;
        }
        .pstat { padding: 10px 5px; border-right: 3px solid #cba6f7; text-align: center; }
        .pstat:last-child { border-right: none; }
        .pstat .psv { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; color: #cba6f7; display: block; }
        .pstat .psl { font-size: 0.5rem; font-weight: 700; letter-spacing: 0.1em; color: #666; text-transform: uppercase; margin-top: 2px; }

    
        /* POLAROID FRAME (Uiverse adaptation) */
        .polaroid-container {
            display: flex;
            justify-content: center;
            margin-top: 30px;
            display: none; /* Nascosto di default */
        }
        
        .polaroid {
            width: 280px;
            padding: 15px 15px 50px 15px;
            background: #f8f8f8;
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.12), 0 2px 2px rgba(0, 0, 0, 0.12), 0 4px 4px rgba(0, 0, 0, 0.12), 0 8px 8px rgba(0, 0, 0, 0.12);
            transform: rotate(-3deg);
            transition: all 0.3s ease;
            position: relative;
        }
        
        .polaroid:hover {
            transform: rotate(0deg) scale(1.05) translateY(-10px);
            box-shadow: 0 2px 2px rgba(0, 0, 0, 0.15), 0 4px 4px rgba(0, 0, 0, 0.15), 0 8px 8px rgba(0, 0, 0, 0.15), 0 16px 16px rgba(0, 0, 0, 0.15);
        }
        
        .photo-area {
            width: 100%;
            height: 250px;
            background: #111;
            position: relative;
            overflow: hidden;
        }
        
        .photo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Adatta l'immagine senza distorcerla */
            display: block;
        }
        
        /* Effetto Polvere */
        .dust {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(#000 1px, transparent 1px), radial-gradient(#000 1px, transparent 1px);
            background-size: 50px 50px;
            background-position: 0 0, 25px 25px;
            opacity: 0.05; /* Leggermente più visibile sull'immagine */
            pointer-events: none;
            z-index: 3;
        }
        
        /* Effetto Graffi */
        .scratches {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(45deg, transparent 45%, rgba(0, 0, 0, 0.08) 46%, transparent 47%) 0 0, linear-gradient(-45deg, transparent 45%, rgba(0, 0, 0, 0.08) 46%, transparent 47%) 0 0;
            background-size: 200px 200px;
            opacity: 0.6;
            pointer-events: none;
            z-index: 3;
        }
        
        /* Effetto Riflesso */
        .photo-area::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(120deg, rgba(255, 255, 255, 0) 30%, rgba(255, 255, 255, 0.2) 32%, rgba(255, 255, 255, 0) 35%);
            animation: shine 4s infinite;
            z-index: 4;
            pointer-events: none;
        }
        
        @keyframes shine {
            0% { transform: translateX(-100%) rotate(120deg); }
            20%, 100% { transform: translateX(100%) rotate(120deg); }
        }
        
        .caption {
            font-family: 'Courier New', monospace;
            text-align: center;
            margin-top: 15px;
            color: #333;
            font-size: 16px;
            font-weight: bold;
            position: absolute;
            bottom: 15px;
            width: 100%;
            left: 0;
        }

    
        /* CASSETTE LOADER (Uiverse.io adaptation) */
        .cassette-wrapper {
            display: none; /* Nascosto di default */
            justify-content: center;
            align-items: center;
            margin: 30px 0;
            transform: scale(0.85); /* Leggermente rimpicciolito per stare nel layout */
        }

        .cassette-card {
            width: 300px;
            height: 200px;
            background: #252525;
            border-radius: 8px;
            box-shadow: rgba(0, 0, 0, 0.4) 0px 2px 4px, rgba(0, 0, 0, 0.3) 0px 7px 13px -3px, rgba(0, 0, 0, 0.2) 0px -3px 0px inset;
        }

        .cassette-ups { display: flex; }
        .screw {
            display: flex; color: black; border: 1px solid black; background-color: lightgrey;
            height: 0.75em; width: 0.75em; border-radius: 50%; align-items: center; justify-content: center;
        }
        .screw1 { margin: 0.5em; }
        .screw2 { margin-top: 0.5em; margin-left: 15.8em; }
        .screw3 { margin-top: -1.3em; margin-left: 0.5em; }
        .screw4 { margin-top: -1.3em; margin-left: 16.35em; }

        .cassette-card1 {
            width: 230px; height: 115px; margin-top: 0.5em; margin-left: 2.18em;
            background-color: #FFFDD0;
            clip-path: polygon(5% 0, 95% 0, 100% 10%, 100% 100%, 100% 100%, 0 100%, 0 100%, 0 10%);
            border-radius: 5px;
        }

        .cassette-line1 { position: relative; width: 200px; height: 1px; background-color: black; top: 1em; left: 0.8em; }
        .cassette-line2 { position: relative; width: 200px; height: 1px; background-color: black; top: 2em; left: 0.8em; }

        .cassette-yl { display: flex; width: 228px; height: 50px; background-color: rgb(242, 188, 0); margin-top: 2.5em; margin-left: 0.06em; }
        
        .cassette-roll {
            width: 8em; height: 2em; margin-left: 3em; border-radius: 15px; background-color: #171717;
            display: flex;
        }

        .cassette-tape { width: 3em; height: 1.5em; position: relative; left: 0.9em; background-color: #252525; }
        
        .cassette-s-wheel {
            display: flex; align-items: center; justify-content: center; position: relative;
            top: 0.215em; left: 0.15em; width: 1.55em; height: 1.55em;
            border: 2px dashed #fff; box-shadow: 0 0 0 4.4px #fff; border-radius: 50%;
            animation: cassetteRun 2s infinite linear;
        }

        .cassette-window { background-color: white; width: auto; height: 2em; }

        .cassette-e-wheel {
            display: flex; align-items: center; justify-content: center; position: relative;
            top: 0.215em; left: 1.7em; width: 1.55em; height: 1.55em;
            border: 2px dashed #fff; box-shadow: 0 0 0 4.4px #fff; border-radius: 50%;
            animation: cassetteRun 2s infinite linear;
        }

        .cassette-num { margin-left: 1.5em; align-self: center; color: white; font-family: sans-serif; font-size: 12px;}

        .cassette-or {
            display: flex; width: 230px; height: 18px; background-color: rgb(241, 90, 37);
            margin-top: 0.4em; margin-left: 0em; border-bottom-left-radius: 4px; border-bottom-right-radius: 4px;
            align-items: center; justify-content: center;
        }

        .cassette-time { font-size: 0.5em; color: white; font-family: sans-serif;}

        .cassette-card2_main { filter: drop-shadow(4px 4px 14px rgba(0, 0, 0, 1)); }
        .cassette-card2 {
            width: 150px; height: 50px; margin-top: 0em; margin-left: 4.6em;
            background-color: #252525; clip-path: polygon(10% 0%, 90% 0%, 100% 100%, 0% 100%);
        }

        .cassette-screw5 { position: relative; display: flex; color: black; border: 1px solid black; background-color: lightgrey; height: 0.75em; width: 0.75em; left: 4.25em; top: -0.5em; border-radius: 50%; align-items: center; justify-content: center; }
        .cassette-c1 { position: relative; width: 0.5em; height: 0.5em; background-color: rgb(190, 190, 190); border-radius: 50%; left: 1.5em; top: 2em; }
        .cassette-t1 { position: relative; width: 0.5em; height: 0.5em; background-color: rgb(190, 190, 190); border-radius: 2px; left: 3em; top: 1em; }
        .cassette-t2 { position: relative; width: 0.5em; height: 0.5em; background-color: rgb(190, 190, 190); border-radius: 2px; left: 5.7em; top: -0.2em; }
        .cassette-c2 { position: relative; width: 0.5em; height: 0.5em; background-color: rgb(190, 190, 190); border-radius: 50%; left: 7.2em; top: -0.2em; }

        @keyframes cassetteRun {
            100% { transform: rotate(360deg); }
        }

    
        /* NEON PROFILE CARD (Uiverse.io adaptation) */
        .glow-profile {
            position: relative;
            width: 220px;
            height: 380px; /* Aumentata l'altezza */
            background-color: #0d0d12;
            overflow: hidden; /* Blocca il testo in eccesso */
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 15px;
            gap: 12px;
            border-radius: 12px;
            cursor: pointer;
            color: white;
            font-family: 'Courier New', monospace;
            z-index: 1;
        }

        .glow-profile::before {
            content: '';
            position: absolute;
            inset: 0;
            left: -5px;
            margin: auto;
            width: 230px; /* Larghezza del bordo esterno */
            height: 330px;
            border-radius: 15px;
            background: linear-gradient(-45deg, #e81cff 0%, #40c9ff 100%);
            z-index: -10;
            pointer-events: none;
            transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glow-profile::after {
            content: "";
            z-index: -1;
            position: absolute;
            inset: 0;
            background: linear-gradient(-45deg, #fc00ff 0%, #00dbde 100%);
            transform: translate3d(0, 0, 0) scale(0.95);
            filter: blur(20px);
            transition: all 0.3s ease;
        }

        .glow-profile:hover::after {
            filter: blur(30px);
        }

        .glow-profile:hover::before {
            transform: rotate(-90deg) scaleX(1.34) scaleY(0.77);
        }

        .glow-profile .prof-img {
            width: 100%;
            height: 140px;
            object-fit: contain;
            border-radius: 8px;
            background: #000;
            border: 1px solid #333;
        }

        .glow-profile .heading {
            font-size: 22px;
            text-transform: capitalize;
            font-weight: bold;
            color: #fff;
            margin: 0;
        }

        .glow-profile p {
            font-size: 12px;
            color: #a6adc8;
            line-height: 1.4;
            margin: 0;
        }

        .glow-profile .stats {
            color: #e81cff; /* Magenta neon */
            font-weight: bold;
            font-size: 13px;
            margin: 0;
            display: flex;
            justify-content: space-between;
        }

    
        /* CAROSELLO FORCE FIX */
        .carousel-inner {
            transform-style: preserve-3d !important;
            animation: rotating 15s linear infinite !important;
        }
        .carousel-card {
            position: absolute !important;
            inset: 0 !important;
            transform-style: preserve-3d !important;
            backface-visibility: hidden;
            /* Forziamo il transform in caso di conflitti */
            transform: rotateY(calc((360deg / var(--quantity)) * var(--index))) translateZ(160px) !important;
        }
        .carousel-card.selected {
            transform: rotateY(calc((360deg / var(--quantity)) * var(--index))) translateZ(200px) !important;
            border-color: #4ade80 !important;
        }

    
        .feedback-form {
            margin-top: 20px; padding: 15px;
            background: #1a1a2e; border: 1px solid #333; border-radius: 10px;
            display: none; flex-direction: column; gap: 10px;
        }
        .feedback-form textarea {
            width: 100%; background: #000; border: 1px solid #333; color: #cdd6f4; 
            padding: 10px; border-radius: 8px; resize: none; height: 60px; 
            font-family: inherit; box-sizing: border-box;
        }

    </style>
</head>
<body>
    <div class="container">
        <h1>🎃 SpookyVest Sandbox</h1>
        
        <div class="drop-zone" id="drop-zone">
            <input type="file" id="file-input" accept="image/*" style="display: none;">
            <p style="color: #cba6f7; font-weight: bold;">Trascina qui una foto o clicca per caricarla</p>
            <p id="file-name" style="color: #888; font-size: 0.9em;"></p>
        </div>

        <div class="layout-masks">
            <!-- 3D Carousel (Sinistra) -->
            <div class="carousel-wrapper">
                <div class="carousel-inner" id="masks-container">
                    <!-- Le carte verranno generate via JS -->
                </div>
            </div>

            <!-- Profile Card (Destra) -->
            <div class="glow-profile" id="mask-profile">
                <img class="prof-img" id="prof-img" src="/static/meloni_thumb.jpg" alt="Mask">
                <div>
                    <div class="heading" id="prof-name">Meloni</div>
                    <p id="prof-bio">Politica italiana, destra, governo, elezioni.</p>
                </div>
                <div class="stats">
                    <span id="stat-1">Ironia 90%</span>
                    <span id="stat-2">Meme 85%</span>
                </div>
            </div>

        <div class="slider-container">
            <span>Intensità Incubo:</span>
            <input type="range" id="intensity" min="0" max="1" step="0.1" value="0.7">
            <span id="intensity-val">70%</span>
        </div>
<button id="transform-btn" style="background: #cba6f7; color: #000; padding: 15px 30px; font-size: 1.2em; cursor: pointer;">🎃 TRASFORMA</button>        
        <!-- TERMINAL LOADER -->
        
        <!-- CASSETTE LOADER -->
        <div class="cassette-wrapper" id="cassette-loader" style="display: none;">
            <div class="cassette-card">
                <div class="cassette-ups">
                    <div class="screw screw1"></div>
                    <div class="screw screw2"></div>
                </div>
                <div class="cassette-card1">
                    <div class="cassette-line1"></div>
                    <div class="cassette-line2"></div>
                    <div class="cassette-yl">
                        <div class="cassette-roll">
                            <div class="cassette-tape"></div>
                            <div class="cassette-s-wheel"></div>
                            <div class="cassette-window"></div>
                            <div class="cassette-e-wheel"></div>
                            <div class="cassette-num">1</div>
                        </div>
                    </div>
                    <div class="cassette-or">
                        <div class="cassette-time">60</div>
                    </div>
                </div>
                <div class="cassette-downs">
                    <div class="screw screw3"></div>
                    <div class="screw screw4"></div>
                </div>
            </div>
            <div class="cassette-card2_main">
                <div class="cassette-card2">
                    <div class="cassette-screw5"></div>
                    <div class="cassette-c1"></div>
                    <div class="cassette-t1"></div>
                    <div class="cassette-t2"></div>
                    <div class="cassette-c2"></div>
                </div>
            </div>
        </div>

        <div class="terminal-loader" id="terminal-loader" style="display: none;">
            <div class="terminal-header">
                <div class="terminal-title">Spooky-Engine.exe</div>
                <div class="terminal-controls">
                    <span class="control close"></span>
                    <span class="control minimize"></span>
                    <span class="control maximize"></span>
                </div>
            </div>
            <div class="terminal-text">Evocando...</div>
        </div>

        <div id="status"></div>
        <div class="polaroid-container" id="polaroid-container">
            <div class="polaroid">
                <div class="photo-area">
                    <img id="result-img" src="" alt="Spooky Meme">
                    <div class="dust"></div>
                    <div class="scratches"></div>
                </div>
                <div class="caption">SpookyVest 🎃</div>
            </div>
        </div>

        <!-- FEEDBACK FORM -->
        <div class="feedback-form" id="feedback-form">
            <h3>Quanto fa paura questo meme? 🎃</h3>
            <div class="icon-row">
                <!-- Bottoni con SVG presi dall'esempio -->
                <button class="icon-btn" title="Terrificante">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 512 512" width="24px"><path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zm177.6 62.1C192.8 334.5 218.8 352 256 352s63.2-17.5 78.4-33.9c9-9.7 24.2-10.4 33.9-1.4s10.4 24.2 1.4 33.9c-22 23.8-60 49.4-113.6 49.4s-91.7-25.5-113.6-49.4c-9-9.7-8.4-24.9 1.4-33.9s24.9-8.4 33.9 1.4zM144.4 208a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm192-32a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"></path></svg>
                </button>
                <button class="icon-btn" title="Spaventoso">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 512 512" width="24px"><path d="M464 256A208 208 0 1 0 48 256a208 208 0 1 0 416 0zM0 256a256 256 0 1 1 512 0A256 256 0 1 1 0 256zM174.6 384.1c-4.5 12.5-18.2 18.9-30.7 14.4s-18.9-18.2-14.4-30.7C146.9 319.4 198.9 288 256 288s109.1 31.4 126.6 79.9c4.5 12.5-2 26.2-14.4 30.7s-26.2-2-30.7-14.4C328.2 358.5 297.2 336 256 336s-72.2 22.5-81.4 48.1zM144.4 208a32 32 0 1 1 64 0 32 32 0 1 1 -64 0zm192-32a32 32 0 1 1 0 64 32 32 0 1 1 0-64z"></path></svg>
                </button>
            </div>
            <textarea placeholder="Scrivi un commento spettrale..."></textarea>
        </div>

    </div>

    <script>
        document.getElementById('transform-btn').onclick = async () => {
            if(!selectedFile) return alert('Carica una foto prima!');
            
            const btn = document.getElementById('transform-btn');
            const status = document.getElementById('status');
            const resultImg = document.getElementById('result-img');
            
            btn.disabled = true;
            btn.textContent = 'Evocando...';
            status.textContent = 'Analisi in corso e scelta della strategia...';
            status.style.color = '#cba6f7';
            
            document.getElementById('cassette-loader').style.display = 'flex';
            document.getElementById('polaroid-container').style.display = 'none';

            const formData = new FormData();
            formData.append('file', selectedFile);
            formData.append('quality', 'auto');

            try {
                const res = await fetch('/api/transform', { method: 'POST', body: formData });
                if(!res.ok) {
                    const err = await res.json();
                    throw new Error(err.detail || 'Errore');
                }
                
                const metaStr = res.headers.get('X-Spooky-Metadata');
                if (metaStr) {
                    const meta = JSON.parse(metaStr);
                    status.textContent = '✅ Fatto! Strategia: ' + meta.strategy.toUpperCase();
                } else {
                    status.textContent = '✅ Trasformazione completata!';
                }
                
                const blob = await res.blob();
                resultImg.src = URL.createObjectURL(blob);
                document.getElementById('polaroid-container').style.display = 'flex';
                status.style.color = '#4ade80';
                
            } catch(e) {
                status.textContent = '❌ ' + e.message;
                status.style.color = '#ef4444';
            } finally {
                btn.disabled = false;
                btn.textContent = '🎃 TRASFORMA';
                document.getElementById('cassette-loader').style.display = 'none';
            }
        };
        </script>
</body>
</html>
