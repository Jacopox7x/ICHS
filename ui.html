<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>iCrawler | Command Center</title>
    <style>
        :root { --bg: #0a0a0f; --panel: #12121a; --purple: #cba6f7; --green: #4ade80; --red: #ef4444; --text: #cdd6f4; --muted: #666; }
        * { box-sizing: border-box; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: var(--text); margin: 0; display: flex; height: 100vh; overflow: hidden; }
        
        /* HEADER */
        .header { position: fixed; top: 0; left: 0; right: 0; height: 50px; background: var(--panel); border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; z-index: 10; }
        .logo { font-size: 1.5em; font-weight: bold; color: var(--purple); text-shadow: 0 0 8px var(--purple); }
        .status-leds { display: flex; gap: 15px; font-size: 0.8em; }
        .led { display: flex; align-items: center; gap: 5px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 5px var(--green); }
        
        /* LAYOUT */
        .layout { display: grid; grid-template-columns: 200px 1fr 350px; width: 100%; height: calc(100vh - 50px); margin-top: 50px; }
        
        /* SIDEBAR SINISTRA */
        .sidebar { background: var(--panel); border-right: 1px solid #333; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .nav-item { padding: 10px; color: var(--muted); cursor: pointer; border-left: 3px solid transparent; }
        .nav-item.active { color: var(--purple); border-left-color: var(--purple); background: rgba(203, 166, 247, 0.1); font-weight: bold; }
        
        /* MAIN CENTER */
        .main { padding: 30px; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; }
        h1 { color: var(--purple); margin: 0 0 10px 0; font-size: 2em; text-transform: uppercase; letter-spacing: 2px; }
        .card { background: var(--panel); border: 1px solid #333; border-radius: 8px; padding: 20px; }
        
        .upload-zone { border: 2px dashed var(--purple); text-align: center; padding: 20px; cursor: pointer; transition: 0.3s; background: rgba(203, 166, 247, 0.05); }
        .upload-zone:hover { background: rgba(203, 166, 247, 0.15); box-shadow: 0 0 15px rgba(203,166,247,0.2); }
        
        textarea { width: 100%; height: 120px; background: #000; border: 1px solid #333; color: var(--text); padding: 10px; font-family: inherit; resize: vertical; border-radius: 5px; }
        textarea:focus { outline: none; border-color: var(--purple); }
        
        .controls { display: flex; gap: 15px; align-items: center; }
        .toggle { display: flex; align-items: center; gap: 5px; color: var(--text); font-size: 0.9em; cursor: pointer; }
        .toggle input { accent-color: var(--purple); width: 16px; height: 16px; }
        
        .btn-main { background: var(--purple); color: #000; border: none; padding: 12px 24px; font-weight: bold; font-size: 1em; cursor: pointer; border-radius: 5px; text-transform: uppercase; transition: 0.3s; flex: 1; }
        .btn-main:hover { box-shadow: 0 0 15px var(--purple); }
        .btn-main:disabled { background: #555; cursor: not-allowed; box-shadow: none; }
        
        #output { background: #000; border: 1px solid #333; padding: 20px; border-radius: 5px; white-space: pre-wrap; font-size: 0.9em; display: none; max-height: 400px; overflow-y: auto; }
        
        /* PANNELLO DESTRO */
        .right-panel { background: var(--panel); border-left: 1px solid #333; display: flex; flex-direction: column; }
        .panel-section { padding: 20px; border-bottom: 1px solid #333; }
        .panel-title { color: var(--purple); font-weight: bold; margin-bottom: 10px; font-size: 0.9em; text-transform: uppercase; letter-spacing: 1px; }
        
        select { width: 100%; background: #000; color: var(--purple); border: 1px solid var(--purple); padding: 8px; font-family: inherit; border-radius: 5px; margin-bottom: 10px; }
        
        .btn-secondary { width: 100%; background: transparent; color: var(--purple); border: 1px solid var(--purple); padding: 8px; cursor: pointer; border-radius: 5px; font-family: inherit; transition: 0.3s; margin-bottom: 10px; }
        .btn-secondary:hover { background: rgba(203, 166, 247, 0.1); }
        
        #cognee-out { font-size: 0.85em; color: var(--muted); max-height: 150px; overflow-y: auto; line-height: 1.4; }
        
        /* CANVAS GRAFO */
        .graph-container { flex: 1; position: relative; background: #050508; min-height: 250px; }
        canvas { width: 100%; height: 100%; display: block; }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo">🕷️ iCrawler</div>
        <div class="status-leds">
            <div class="led"><div class="dot"></div> Ollama</div>
            <div class="led"><div class="dot"></div> GLiNER</div>
            <div class="led"><div class="dot"></div> SearXNG</div>
        </div>
    </div>

    <div class="layout">
        <!-- SIDEBAR -->
        <div class="sidebar">
            <div class="nav-item active" id="nav-gen">Generatore</div>
            <div class="nav-item" id="nav-kb">Knowledge Base</div>
            <div class="nav-item" id="nav-pattern">Pattern</div>
        </div>

        <!-- MAIN -->
        <div class="main">
            <h1>Strategie in Movimento</h1>
            
            <div class="card">
                <div class="upload-zone" id="drop-zone">
                    <input type="file" id="file-input" accept="image/*" style="display: none;">
                    <div style="color: var(--purple); font-weight: bold; margin-bottom: 5px;">👁️ ANALISI VISIVA E OCR</div>
                    <div style="color: var(--muted); font-size: 0.85em;">Trascina un'immagine o clicca per caricarla</div>
                    <div id="upload-status" style="color: var(--green); font-size: 0.85em; margin-top: 10px; font-weight: bold;"></div>
                </div>
            </div>

            <div class="card" style="padding: 15px;">
                <textarea id="brief-area" placeholder="Incolla qui il brief strategico..."></textarea>
                
                <div class="controls" style="margin-top: 15px;">
                    <label class="toggle">
                        <input type="checkbox" id="usa-contesto" checked>
                        Usa Memoria Cliente
                    </label>
                    <button id="clear-btn" class="btn-secondary" style="width: auto; margin: 0;">Svuota</button>
                    <button id="generate-btn" class="btn-main">Genera Piano</button>
                </div>
            </div>

            <div id="output"></div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="right-panel">
            <div class="panel-section">
                <div class="panel-title">🧠 Cliente Attivo</div>
                <select id="cliente-select">
                    <option value="cosper">Cosper</option>
                    <option value="creazioni_migranti">CreAzioni Migranti</option>
                    <option value="cooperativa_inesistente">Test Sconosciuto</option>
                </select>
                
                <button id="cognee-btn" class="btn-secondary">Interroga Memoria</button>
                <div id="cognee-out">Seleziona un cliente e interroga il Knowledge Graph.</div>
            </div>
            
            <div class="panel-section" style="flex: 1; display: flex; flex-direction: column; padding-bottom: 0; border-bottom: none;">
                <div class="panel-title">🕸️ Knowledge Graph</div>
                <button id="graph-btn" class="btn-secondary">Rigenera Grafo</button>
                <div class="graph-container" id="graph-box">
                    <canvas id="graph-canvas"></canvas>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // Elementi UI
            const dropZone = document.getElementById('drop-zone');
            const fileInput = document.getElementById('file-input');
            const uploadStatus = document.getElementById('upload-status');
            const briefArea = document.getElementById('brief-area');
            const genBtn = document.getElementById('generate-btn');
            const clearBtn = document.getElementById('clear-btn');
            const output = document.getElementById('output');
            const clienteSelect = document.getElementById('cliente-select');
            const cogneeBtn = document.getElementById('cognee-btn');
            const cogneeOut = document.getElementById('cognee-out');
            const graphBtn = document.getElementById('graph-btn');
            const canvas = document.getElementById('graph-canvas');

            // --- NAVIGAZIONE SIDEBAR ---
            const navItems = document.querySelectorAll('.nav-item');
            navItems.forEach(item => {
                item.addEventListener('click', () => {
                    // Rimuovi 'active' da tutti
                    navItems.forEach(n => n.classList.remove('active'));
                    // Aggiungi 'active' a quello cliccato
                    item.classList.add('active');
                    
                    // Feedback visivo per le sezioni in sviluppo
                    const text = item.textContent.trim();
                    if (text === 'Knowledge Base' || text === 'Pattern') {
                        alert("La sezione '" + text + "' sarà disponibile nella prossima versione!");
                    } else {
                        // Se clicchi Generatore, resetta la visuale
                        briefArea.value = '';
                        output.style.display = 'none';
                    }
                });
            });

            // --- UPLOAD E VISIONE ---
            dropZone.addEventListener('click', () => fileInput.click());
            dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--green)'; });
            dropZone.addEventListener('dragleave', (e) => { e.preventDefault(); dropZone.style.borderColor = 'var(--purple)'; });
            dropZone.addEventListener('drop', (e) => {
                e.preventDefault();
                dropZone.style.borderColor = 'var(--purple)';
                if (e.dataTransfer.files.length) processImage(e.dataTransfer.files[0]);
            });
            fileInput.addEventListener('change', (e) => { if (e.target.files.length) processImage(e.target.files[0]); });

            async function processImage(file) {
                uploadStatus.textContent = "⏳ Analisi visiva in corso...";
                uploadStatus.style.color = "#fbbf24";
                const formData = new FormData();
                formData.append('file', file);

                try {
                    const controller = new AbortController();
                    const timeoutId = setTimeout(() => controller.abort(), 30000); // 30s timeout
                    
                    const res = await fetch('/analyze_vision', { method: 'POST', body: formData, signal: controller.signal });
                    clearTimeout(timeoutId);
                    const data = await res.json();

                    if (data.vision) {
                        const v = data.vision;
                        let text = "[BRIEF IBRIDO: TESTO E IMMAGINE]\n\n";
                        text += "COSA SI VEDE NELL'IMMAGINE:\n" + (v.descrizione_generica || 'Nessuna descrizione') + "\n\n";
                        text += "TESTO ESTRATTO DALL'IMMAGINE:\n\"" + (v.testo_visibile || 'Nessun testo visibile') + "\"\n\n";
                        text += "[ISTRUZIONI PER IL MODELLO]\n";
                        text += "Il brief è una locandina o un'immagine. Adatta il tono in base al contenuto: ";
                        text += "se è un meme o un contenuto leggero, gioca sull'ironia; ";
                        text += "se è un evento istituzionale o formale, mantieni un tono professionale, caldo e adatto al contesto.";

                        briefArea.value = text;
                        uploadStatus.textContent = "✅ Brief Ibrido generato!";
                        uploadStatus.style.color = "var(--green)";
                    } else {
                        uploadStatus.textContent = "⚠️ Nessun dato visivo rilevato.";
                        uploadStatus.style.color = "#fbbf24";
                    }
                } catch (err) {
                    if (err.name === 'AbortError') {
                        uploadStatus.textContent = "⚠️ Timeout Visione, uso OCR...";
                        const ocrRes = await fetch('/ocr', { method: 'POST', body: formData });
                        const ocrData = await ocrRes.json();
                        if (ocrData.testo) {
                            briefArea.value = "[TESTO ESTRATTO DALL'OCR]\n" + ocrData.testo;
                            uploadStatus.textContent = "✅ Testo estratto via OCR!";
                            uploadStatus.style.color = "var(--green)";
                        }
                    } else {
                        uploadStatus.textContent = "❌ Errore di rete.";
                        uploadStatus.style.color = "var(--red)";
                    }
                }
            }

            // --- GENERAZIONE ---
            genBtn.addEventListener('click', async () => {
                const brief = briefArea.value.trim();
                if (!brief) return alert("Inserisci un brief!");
                
                genBtn.disabled = true;
                genBtn.textContent = "Elaborazione in corso...";
                output.style.display = 'block';
                output.textContent = "⏳ Qwen sta generando il piano...";

                const usaContesto = document.getElementById('usa-contesto').checked;
                try {
                    const res = await fetch('/genera', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ brief: brief, sandbox: clienteSelect.value, mode: 'social', usa_contesto: usaContesto })
                    });
                    const data = await res.json();
                    
                    if (data.piano && data.piano.includes("Errore di generazione")) {
                        output.innerHTML = `<div style="color: #fbbf24; border-left: 4px solid #fbbf24; padding-left: 10px;">🛡️ <strong>Quality Gate Attivato</strong><br><br>${data.piano}</div>`;
                    } else {
                        output.textContent = data.piano || "Nessun piano ricevuto.";
                    }
                } catch (err) {
                    output.textContent = "❌ Errore: " + err.message;
                } finally {
                    genBtn.disabled = false;
                    genBtn.textContent = "Genera Piano";
                }
            });

            // --- SVUOTA ---
            clearBtn.addEventListener('click', () => {
                briefArea.value = '';
                output.style.display = 'none';
                uploadStatus.textContent = '';
                cogneeOut.textContent = "Seleziona un cliente e interroga il Knowledge Graph.";
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            });

            // --- COGNEE ---
            cogneeBtn.addEventListener('click', async () => {
                cogneeOut.textContent = "⏳ Interrogo Cognee...";
                try {
                    const res = await fetch('/api/contesto_cliente?cliente=' + clienteSelect.value);
                    const data = await res.json();
                    cogneeOut.textContent = data.contesto || "Nessun contesto trovato.";
                } catch (err) {
                    cogneeOut.textContent = "❌ Errore: " + err.message;
                }
            });

            // --- GRAFO IN PURO JAVASCRIPT (OFFLINE) ---
            graphBtn.addEventListener('click', async () => {
                const ctx = canvas.getContext('2d');
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#666";
                ctx.font = "12px Courier New";
                ctx.fillText("Caricamento grafo...", 20, 30);

                try {
                    const res = await fetch('/api/grafo_cliente?cliente=' + clienteSelect.value);
                    const data = await res.json();
                    if (data.error) throw new Error(data.error);
                    
                    drawGraph(data.nodes, data.edges);
                } catch (err) {
                    ctx.fillStyle = "red";
                    ctx.fillText("Errore: " + err.message, 20, 50);
                }
            });

            function drawGraph(nodes, edges) {
                const ctx = canvas.getContext('2d');
                canvas.width = canvas.parentElement.clientWidth;
                canvas.height = canvas.parentElement.clientHeight;
                ctx.clearRect(0, 0, canvas.width, canvas.height);

                if (nodes.length === 0) {
                    ctx.fillStyle = "#666";
                    ctx.font = "12px Courier New";
                    ctx.fillText("Nessun nodo trovato per questo cliente.", 20, 30);
                    return;
                }

                // Layout circolare semplice
                const centerX = canvas.width / 2;
                const centerY = canvas.height / 2;
                const radius = Math.min(centerX, centerY) - 40;

                const nodePositions = {};
                nodes.forEach((node, i) => {
                    const angle = (i / nodes.length) * 2 * Math.PI;
                    nodePositions[node.id] = {
                        x: centerX + radius * Math.cos(angle),
                        y: centerY + radius * Math.sin(angle),
                        label: node.label
                    };
                });

                // Disegna archi
                ctx.strokeStyle = "rgba(203, 166, 247, 0.3)";
                ctx.lineWidth = 1.5;
                edges.forEach(edge => {
                    const from = nodePositions[edge.from];
                    const to = nodePositions[edge.to];
                    if (from && to) {
                        ctx.beginPath();
                        ctx.moveTo(from.x, from.y);
                        ctx.lineTo(to.x, to.y);
                        ctx.stroke();
                    }
                });

                // Disegna nodi
                ctx.fillStyle = "#cba6f7";
                ctx.textAlign = "center";
                ctx.textBaseline = "middle";
                ctx.font = "10px Courier New";

                nodes.forEach(node => {
                    const pos = nodePositions[node.id];
                    if (!pos) return;
                    
                    ctx.beginPath();
                    ctx.arc(pos.x, pos.y, 6, 0, 2 * Math.PI);
                    ctx.fill();
                    
                    ctx.fillStyle = "#cdd6f4";
                    // Tronca label lunghe
                    let label = pos.label.length > 15 ? pos.label.substring(0, 15) + "..." : pos.label;
                    ctx.fillText(label, pos.x, pos.y + 15);
                    ctx.fillStyle = "#cba6f7";
                });
            }

            // Auto-draw on load
            setTimeout(() => graphBtn.click(), 1000);
        });
    </script>
</body>
</html>
